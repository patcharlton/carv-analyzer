services:
  - type: web
    name: carv-analyzer-api
    runtime: python
    rootDir: Carvtrainer/backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: carv-db
          property: connectionString

databases:
  - name: carv-db
    plan: free
    databaseName: carv_sessions
