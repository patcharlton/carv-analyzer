[project]
name = "carv-mcp"
version = "0.1.0"
description = "MCP server for CARV ski analysis"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "anthropic>=0.39.0",
    "Pillow>=10.0.0",
]

[project.scripts]
carv-mcp = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
